[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-coach"
version = "0.1.0"
description = "Explicit local task management for Hermes workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
task-coach = "task_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["task_coach*"]

[tool.setuptools.data-files]
"share/task-coach/skill" = ["skills/task-coach/SKILL.md"]
